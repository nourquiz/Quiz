<style>
:root{--bg:#f6f3fb;--ink:#1d2b2a;--card:#fff;--acc:#7c3aed;--accT:#6d28d9;--hi:#f2b134;--ok:#15803d;--bad:#b91c1c;--line:#ddd3ee}
@media(prefers-color-scheme:dark){:root{--bg:#14101f;--ink:#f1edf9;--card:#1e1830;--accT:#c4b5fd;--line:#3b2f5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.6}
#app{max-width:520px;margin:auto;padding:16px}
h1{font-size:28px;font-weight:900;margin:8px 0}
h2{font-size:20px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
input,select,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px 16px;cursor:pointer;background:var(--acc);color:#fff;width:100%;margin:6px 0}
button.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.sub{background:var(--card);color:var(--ink);border:1px solid var(--line);text-align:right;display:flex;align-items:center;gap:10px}
button.sub i{width:12px;height:12px;border-radius:50%;display:inline-block}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hi)}
.top{display:flex;justify-content:space-between;align-items:center}
.top button{width:auto;padding:6px 12px}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.big{font-size:40px;font-weight:900;color:var(--accT)}
.msg{color:var(--bad);min-height:24px}
small{opacity:.7}
</style>

});

function authView() {
  app.innerHTML = `<h1>سداد</h1><div class="card">
    <input id="n" placeholder="اسمك (للتسجيل الجديد فقط)">
    <input id="u" placeholder="اسم المستخدم (حروف إنكليزية وأرقام)" autocapitalize="none" dir="ltr">
    <input id="p" type="password" placeholder="كلمة السر (6 أحرف على الأقل)" dir="ltr">
    <div class="msg" id="m"></div>
    <button id="in">دخول</button><button id="up" class="alt">إنشاء حساب جديد</button></div>`;
  const cred = () => [$("u").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "") + "@quiz.app", $("p").value];
  $("in").onclick = async () => { try { await signInWithEmailAndPassword(auth, ...cred()); } catch { $("m").textContent = "اسم المستخدم أو كلمة السر غير صحيحة"; } };
  $("up").onclick = async () => {
    const name = $("n").value.trim();
    if (!name) return $("m").textContent = "اكتب اسمك أولاً";
    try {
      const r = await createUserWithEmailAndPassword(auth, ...cred());
      if (r.user.email !== TEACHER + "@quiz.app") await setDoc(doc(db, "users", r.user.uid), {name, solved: 0, correct: 0});
    } catch (e) { $("m").textContent = e.code === "auth/email-already-in-use" ? "اسم المستخدم مأخوذ، جرّب غيره" : "تأكد من اسم المستخدم وكلمة السر (6 أحرف أو أكثر)"; }
  };
}

async function guard(fn) {
  try { await fn(); } catch (e) {
    app.innerHTML = `<h2>صار خطأ</h2><div class="card">${esc(e.code || e.message)}</div><button id="b">رجوع</button>`;
    $("b").onclick = home;
  }
}

function head() {
  return `<div class="top"><h1>أهلاً ${esc(myName)}</h1><button class="alt" id="out">خروج</button></div>`;
}
function bindOut() { $("out").onclick = () => signOut(auth); }

const WK = (() => { const d = new Date(), t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); return t.getUTCFullYear() + "W" + Math.ceil(((t - new Date(Date.UTC(t.getUTCFullYear(), 0, 1))) / 864e5 + 1) / 7); })();
const dayStr = o => new Date(Date.now() - o * 864e5).toISOString().slice(0, 10);

function home() {
  app.innerHTML = head() + `<div class="card" id="st">🔥 0 يوم · ⭐ 0 نقطة</div><h2>اختر المادة</h2>` +
    SUBJECTS.map(([s, c], i) => `<button class="sub" data-i="${i}"><i style="background:${c}"></i>${s}</button>`).join("") +
    `<button id="rv" class="alt">🔁 راجع أخطائي</button><button id="lb" style="background:var(--hi);color:#1d2b2a">🏆 لوحة الشرف</button>` +
    (isT ? `<button id="tp" class="alt">لوحة المدرّس</button>` : "");
  bindOut();
  document.querySelectorAll(".sub").forEach(b => b.onclick = () => guard(() => quiz(SUBJECTS[b.dataset.i][0])));
  $("rv").onclick = () => guard(() => quiz("__r"));
  $("lb").onclick = () => guard(() => board());
  if (isT) $("tp").onclick = () => guard(teacher);
  getDoc(doc(db, "users", me.uid)).then(d => { const u = d.data() || {}; $("st").textContent = `🔥 ${u.last >= dayStr(1) ? u.streak || 0 : 0} يوم · ⭐ ${u.pts || 0} نقطة`; }).catch(() => {});
}

async function quiz(subject) {
  app.innerHTML = `<p>جارِ التحميل…</p>`;
  const u0 = (await getDoc(doc(db, "users", me.uid))).data() || {};
  const rev = subject === "__r";
  let qs;
  if (rev) qs = (await Promise.all((u0.wrong || []).slice(0, 20).map(id => getDoc(doc(db, "questions", id))))).filter(d => d.exists()).map(d => ({id: d.id, ...d.data()}));
  else qs = (await getDocs(query(collection(db, "questions"), where("subject", "==", subject)))).docs.map(d => ({id: d.id, ...d.data()}));
  qs.sort(() => Math.random() - .5);
  if (!qs.length) { app.innerHTML = `<h2>${rev ? "مراجعة الأخطاء" : subject}</h2><div class="card">${rev ? "ما عندك أخطاء للمراجعة 👏" : "ما في أسئلة بهالمادة بعد."}</div><button id="b">رجوع</button>`; $("b").onclick = home; return; }
  const si = SUBJECTS.findIndex(x => x[0] === subject);
  let i = 0, right = 0, first = true, tm;
  const save = (q, ok) => {
    const d = {solved: increment(1), correct: increment(ok ? 1 : 0), pts: increment(ok ? 10 : 0), wrong: ok ? arrayRemove(q.id) : arrayUnion(q.id)};
    if (si >= 0) d[`w${WK}_${si}`] = increment(1);
    if (first) { first = false; const t = dayStr(0); if (u0.last !== t) { d.streak = u0.last === dayStr(1) ? (u0.streak || 0) + 1 : 1; d.last = t; } }
    setDoc(doc(db, "users", me.uid), d, {merge: true}).catch(() => {});
  };
  const show = () => {
    clearInterval(tm);
    if (i >= qs.length) { app.innerHTML = `<h2>${rev ? "مراجعة الأخطاء" : subject}</h2><div class="card"><div class="big">${right} / ${qs.length}</div>إجابات صحيحة</div><button id="b">رجوع للمواد</button>`; $("b").onclick = home; return; }
    const q = qs[i]; let t = 30;
    app.innerHTML = `<div class="top"><small>${rev ? "مراجعة الأخطاء" : subject} · ${i + 1} من ${qs.length}</small><b id="t">30</b></div><div class="card"><b>${esc(q.q)}</b></div>` +
      q.options.map((o, k) => `<button class="alt opt" data-k="${k}">${esc(o)}</button>`).join("") + `<div id="nx"></div>`;
    const ans = k => {
      clearInterval(tm);
      const ok = k === q.answer;
      document.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.k === q.answer) x.classList.add("ok"); });
      if (k >= 0 && !ok) document.querySelector(`.opt[data-k="${k}"]`).classList.add("bad");
      if (ok) right++;
      $("nx").innerHTML = (q.exp ? `<div class="card">💡 ${esc(q.exp)}</div>` : "") + `<button id="n">${i + 1 === qs.length ? "النتيجة" : "السؤال التالي"}</button>`;
      $("n").onclick = () => { i++; show(); };
      if (!isT) save(q, ok);
    };
    document.querySelectorAll(".opt").forEach(b => b.onclick = () => ans(+b.dataset.k));
    tm = setInterval(() => { t--; $("t").textContent = t; if (t <= 0) ans(-1); }, 1000);
  };
  show();
}

async function board(si = null) {
  app.innerHTML = `<p>جارِ التحميل…</p>`;
  const f = si === null ? "solved" : `w${WK}_${si}`;
  const s = await getDocs(query(collection(db, "users"), orderBy(f, "desc"), limit(10)));
  const medal = ["🥇", "🥈", "🥉"];
  app.innerHTML = `<h1>🏆 لوحة الشرف</h1><select id="bs"><option value="">الأكثر نشاطاً (الكل)</option>${SUBJECTS.map(([n], k) => `<option value="${k}" ${si === k ? "selected" : ""}>أبطال ${n} هالأسبوع</option>`).join("")}</select><div class="card">` +
    (s.docs.map((d, i) => `<div class="row"><span>${medal[i] || i + 1} ${esc(d.data().name)}</span><b>${d.data()[f] || 0}</b></div>`).join("") || "ما حدا حل أسئلة بعد.") +
    `</div><button id="b">رجوع</button>`;
  $("bs").onchange = e => guard(() => board(e.target.value === "" ? null : +e.target.value));
  $("b").onclick = home;
}

async function teacher() {
  const cnt = (await getCountFromServer(collection(db, "users"))).data().count;
  const opts = SUBJECTS.map(([s]) => `<option>${s}</option>`).join("");
  app.innerHTML = `<h1>لوحة المدرّس</h1><div class="card">عدد الطلاب المسجلين<div class="big">${cnt}</div></div>
    <div class="card"><h2>إضافة سؤال</h2><select id="s">${opts}</select>
    <textarea id="q" rows="2" placeholder="نص السؤال"></textarea>
    ${[0, 1, 2, 3].map(k => `<input class="o" placeholder="الخيار ${k + 1}">`).join("")}
    <select id="a"><option value="0">الجواب الصحيح: الخيار 1</option><option value="1">الخيار 2</option><option value="2">الخيار 3</option><option value="3">الخيار 4</option></select>
    <input id="e" placeholder="شرح الجواب (اختياري)">
    <div class="msg" id="m"></div><button id="add">حفظ السؤال</button></div>
    <div class="card"><h2>إضافة أسئلة دفعة وحدة</h2><small>سطر لكل سؤال (للمادة المختارة فوق):<br>السؤال | خيار1 | خيار2 | خيار3 | خيار4 | رقم الجواب | شرح</small>
    <textarea id="bk" rows="6" placeholder="2+2 = ؟ | 3 | 4 | 5 | 6 | 2 | لأنو جمع عددين"></textarea>
    <div class="msg" id="m2"></div><button id="bkb">حفظ الكل</button></div>
    <div class="card"><h2>أسئلة المادة</h2><select id="f">${opts}</select><div id="l"></div></div>
    <button id="b" class="alt">رجوع</button>`;
  $("b").onclick = home;
  const list = async () => {
    const s = await getDocs(query(collection(db, "questions"), where("subject", "==", $("f").value)));
    $("l").innerHTML = s.docs.map(d => `<div class="row"><span>${esc(d.data().q)}</span><button class="alt" data-id="${d.id}" style="width:auto">حذف</button></div>`).join("") || "<small>ما في أسئلة</small>";
    $("l").querySelectorAll("button").forEach(b => b.onclick = async () => { await deleteDoc(doc(db, "questions", b.dataset.id)); list(); });
  };
  $("f").onchange = list; list();
  $("add").onclick = async () => {
    const op = [...document.querySelectorAll(".o")].map(x => x.value.trim()), q = $("q").value.trim();
    if (!q || op.some(x => !x)) return $("m").textContent = "عبّي السؤال والخيارات الأربعة";
    await addDoc(collection(db, "questions"), {subject: $("s").value, q, options: op, answer: +$("a").value, exp: $("e").value.trim()});
    $("q").value = ""; $("e").value = ""; document.querySelectorAll(".o").forEach(x => x.value = ""); $("m").textContent = "";
    $("f").value = $("s").value; list();
  };
  $("bkb").onclick = async () => {
    const lines = $("bk").value.split("\n").map(x => x.trim()).filter(Boolean); let n = 0;
    for (const l of lines) {
      const p = l.split("|").map(x => x.trim()), a = +(p[5] || "").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)) - 1;
      if (p.length < 6 || p.slice(0, 5).some(x => !x) || !(a >= 0 && a < 4)) continue;
      await addDoc(collection(db, "questions"), {subject: $("s").value, q: p[0], options: p.slice(1, 5), answer: a, exp: p[6] || ""}); n++;
    }
    $("bk").value = ""; $("m2").textContent = `انحفظ ${n} من ${lines.length} سؤال`; $("f").value = $("s").value; list();
  };
}
</script>
</body>
</html>
